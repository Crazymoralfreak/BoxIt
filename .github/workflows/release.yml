name: Release

# A tag v* builds BoxIt for Windows x64, Windows ARM64, macOS (Intel and
# Apple Silicon) and Linux (x64 and ARM64). Windows x64 is built here, with
# a profile from the benchmark corpus, the NSIS installer and the portable
# zip. The other machines are built by the desktop workflow: dmg, deb,
# AppImage and an ARM64 installer.
#
# The portable copy is packed as a zip and is not an updater target: it has
# no installer to replace itself with.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  desktop:
    uses: ./.github/workflows/platforms.yml
    secrets: inherit

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Build the interface
        run: npm run build

      # Train on the command line. The small corpus is the one the bench
      # command uses unless --full is passed; it exercises every codec the
      # release build then optimizes.
      - name: Collect a profile
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "pgo"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $env:RUSTFLAGS = "-Cprofile-generate=$dir"
          cargo build --release -p boxit-cli --locked
          & target/release/boxit-cli.exe bench --runs 1
          $profdata = Get-ChildItem (Join-Path (rustc --print sysroot) "lib") -Recurse -Filter llvm-profdata.exe |
            Select-Object -First 1 -ExpandProperty FullName
          $merged = Join-Path $env:RUNNER_TEMP "merged.profdata"
          & $profdata merge -o $merged $dir
          "RUSTFLAGS=-Cprofile-use=$merged" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      - name: Build the self-extractor with the profile
        run: cargo build --release -p boxit-sfx --locked

      - name: Build the Windows 11 menu
        run: |
          $env:RUSTFLAGS = $null
          cargo build --release -p boxit-shell --locked

      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json

      - name: Build the command line with the profile
        run: cargo build --release -p boxit-cli --locked

      - name: Pack the portable copy
        run: |
          node scripts/make-portable.mjs --no-build
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path portable/BoxIt -DestinationPath "BoxIt_${version}_x64-portable.zip"

      - name: Gather the files of the release
        run: |
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          Get-ChildItem -Recurse -File -Path target, src-tauri/target -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\bundle\\' -and $_.Extension -eq '.exe' } |
            Copy-Item -Destination release-out
          Copy-Item BoxIt_*_x64-portable.zip release-out

      # The signature stays off the release page. The manifest job reads it.
      - uses: actions/upload-artifact@v7
        with:
          name: updater-sig-windows-x86_64
          path: target/release/bundle/nsis/*.sig
          if-no-files-found: error

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*

  # Installed copies read latest.json. The signature is inside that file, so
  # the .sig files themselves are not published.
  manifest:
    name: Update manifest
    needs: [windows, desktop]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: updater-sig-*
          path: sigs

      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'EOF'
          import { readdirSync, readFileSync, existsSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const tag = process.env.GITHUB_REF_NAME;
          const version = tag.replace(/^v/, "");
          const repo = process.env.GITHUB_REPOSITORY;
          const groups = {
            "updater-sig-windows-x86_64": [
              { suffix: ".exe.sig", keys: ["windows-x86_64", "windows-x86_64-nsis"], file: `BoxIt_${version}_x64-setup.exe` },
            ],
            "updater-sig-windows-aarch64": [
              { suffix: ".exe.sig", keys: ["windows-aarch64", "windows-aarch64-nsis"], file: `BoxIt_${version}_arm64-setup.exe` },
            ],
            "updater-sig-darwin-aarch64": [
              { suffix: ".tar.gz.sig", keys: ["darwin-aarch64", "darwin-aarch64-app"], file: `BoxIt_${version}_aarch64.app.tar.gz` },
            ],
            "updater-sig-darwin-x86_64": [
              { suffix: ".tar.gz.sig", keys: ["darwin-x86_64", "darwin-x86_64-app"], file: `BoxIt_${version}_x64.app.tar.gz` },
            ],
            "updater-sig-linux-x86_64": [
              { suffix: ".deb.sig", keys: ["linux-x86_64-deb"] },
              { suffix: ".AppImage.sig", keys: ["linux-x86_64-appimage"] },
            ],
            "updater-sig-linux-aarch64": [
              { suffix: ".deb.sig", keys: ["linux-aarch64-deb"] },
              { suffix: ".AppImage.sig", keys: ["linux-aarch64-appimage"] },
            ],
          };
          const platforms = {};
          for (const [folder, specs] of Object.entries(groups)) {
            const dir = join("sigs", folder);
            if (!existsSync(dir)) continue;
            const names = readdirSync(dir);
            for (const spec of specs) {
              const sigName = names.find((name) => name.endsWith(spec.suffix));
              if (!sigName) continue;
              const file = spec.file ?? sigName.slice(0, -".sig".length);
              const entry = {
                signature: readFileSync(join(dir, sigName), "utf8").trim(),
                url: `https://github.com/${repo}/releases/download/${tag}/${file}`,
              };
              for (const key of spec.keys) platforms[key] = entry;
            }
          }
          if (!platforms["windows-x86_64"]) {
            console.error("The Windows x64 signature is missing");
            process.exit(1);
          }
          const manifest = {
            version,
            notes: `https://github.com/${repo}/releases/tag/${tag}`,
            pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
            platforms,
          };
          writeFileSync("latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          EOF
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
