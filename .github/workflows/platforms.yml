name: Desktop builds

# The window, for every machine the release is offered on. A tag builds them
# through the release workflow. This file can also be started by hand; then
# the installers are artifacts of the run and are not published.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            bundles: dmg
            config: src-tauri/tauri.macos.conf.json
            icns: true
            updater: darwin-aarch64
            updaterFile: aarch64
          - name: macOS Intel
            os: macos-15-intel
            bundles: dmg
            config: src-tauri/tauri.macos.conf.json
            icns: true
            updater: darwin-x86_64
            updaterFile: x64
          - name: Linux x64
            os: ubuntu-24.04
            bundles: deb,appimage
            config: src-tauri/tauri.linux.conf.json
            icns: false
            updater: linux-x86_64
            updaterFile: ""
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            bundles: deb,appimage
            config: src-tauri/tauri.linux.conf.json
            icns: false
            updater: linux-aarch64
            updaterFile: ""
          - name: Windows ARM64
            os: windows-11-arm
            bundles: nsis
            config: src-tauri/tauri.release.conf.json
            icns: false
            updater: windows-aarch64
            updaterFile: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo grep -lR --include='*.list' --include='*.sources' packages.microsoft.com /etc/apt | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libxdo-dev file

      - name: Install dependencies
        run: npm ci

      - name: macOS icon
        if: matrix.icns
        run: |
          set=src-tauri/icons/icon.iconset
          mkdir -p "$set"
          sips -z 16 16 src-tauri/icons/32x32.png --out "$set/icon_16x16.png"
          sips -z 32 32 src-tauri/icons/32x32.png --out "$set/icon_16x16@2x.png"
          sips -z 32 32 src-tauri/icons/32x32.png --out "$set/icon_32x32.png"
          sips -z 64 64 src-tauri/icons/128x128.png --out "$set/icon_32x32@2x.png"
          sips -z 128 128 src-tauri/icons/128x128.png --out "$set/icon_128x128.png"
          sips -z 256 256 src-tauri/icons/128x128@2x.png --out "$set/icon_128x128@2x.png"
          sips -z 256 256 src-tauri/icons/128x128@2x.png --out "$set/icon_256x256.png"
          sips -z 512 512 src-tauri/icons/128x128@2x.png --out "$set/icon_256x256@2x.png"
          sips -z 512 512 src-tauri/icons/128x128@2x.png --out "$set/icon_512x512.png"
          sips -z 1024 1024 src-tauri/icons/128x128@2x.png --out "$set/icon_512x512@2x.png"
          iconutil -c icns "$set" -o src-tauri/icons/icon.icns

      - name: Build
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          build() {
            npm run tauri -- build --bundles ${{ matrix.bundles }} \
              --config ${{ matrix.config }} \
              --config src-tauri/tauri.release.conf.json
          }
          if [ "${{ runner.os }}" != "macOS" ]; then
            build
            exit 0
          fi
          # hdiutil on the Intel runner often cannot eject the image it just
          # made and reports "Resource busy". The application is already
          # compiled, so the next attempt only repeats the disk image.
          set +e
          code=1
          for attempt in 1 2 3; do
            build
            code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            echo "dmg attempt ${attempt} failed (${code})"
            sleep 20
          done
          exit "$code"

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-out
          # The workspace writes bundles under target/. src-tauri/target is
          # only there when the window crate was built on its own, and find
          # fails the step when a starting directory is missing.
          for dir in target src-tauri/target; do
            if [ -d "$dir" ]; then
              find "$dir" -path '*/bundle/*' -type f \
                \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \) \
                -exec cp {} release-out/ \;
            fi
          done
          # The Mac updater installs the application archive, not the disk image.
          # The two architectures would otherwise both be named BoxIt.app.tar.gz.
          if [ "$(uname)" = "Darwin" ]; then
            version=$(node -p "require('./package.json').version")
            archive=$(find target -path '*/bundle/macos/*.app.tar.gz' -type f | head -n 1)
            cp "$archive" "release-out/BoxIt_${version}_${{ matrix.updaterFile }}.app.tar.gz"
          fi

      - name: Keep the updater signature
        if: matrix.updater != '' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: updater-sig-${{ matrix.updater }}
          path: target/release/bundle/**/*.sig
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: boxit-${{ matrix.name }}
          path: release-out/
          if-no-files-found: error

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*
